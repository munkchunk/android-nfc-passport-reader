name: Bug report
description: Something in the library or the sample app does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a problem reading a particular passport, the **Passport read report** form asks for what is needed. To report a security vulnerability, do not open an issue: use the repository's **Security** tab.

        **Never include personal data.** No names, dates of birth or expiry, document numbers, MRZ lines, physical details, photos or screenshots of a real read. A debug build logs the MRZ and some details of the holder, so check every log line before pasting it.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Library version or commit
    validations:
      required: false
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Remove any personal data first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: This report contains nothing that describes a passport holder - no name, document number, MRZ, dates of birth or expiry, or physical details.
          required: true
